# Momento configuration
# -----------------------
# Copy to ~/.config/momento/config.toml (install.sh does this for you if the
# file doesn't exist yet). Every key is optional: anything you delete or leave
# commented out falls back to the built-in default shown here.
# Restart the recorder after editing:  systemctl --user restart momento.service

[capture]
# What to record:
#   "auto"      pick the best source for this session (recommended)
#   "portal"    desktop/monitor chosen in the system "share your screen" dialog
#               (KDE, GNOME, wlroots/Hyprland/Sway — Wayland). Asked once, remembered.
#   "gamescope" Steam Gaming Mode / gamescope's own PipeWire output
#   "x11"       grab the whole X11 screen (X11 sessions only)
#   "test"      a moving test pattern — for trying Momento without a game
source = "auto"

# What to record:
#   "window"   only the window you pick (default). The Momento bar and desktop
#              notifications are then never in your clips. Momento doesn't
#              start recording on its own: open the bar and press play, then
#              pick your game's window. When that window closes, recording
#              stops by itself (like pressing Stop). Pause and play keep the
#              same window; Stop and then play lets you pick a new one.
#              Needs the "portal" source (the default on Wayland).
#   "screen"   your whole screen. Starts recording by itself when you log in.
# Change it with:  momento set record screen      (or Settings -> Record in the bar)
target = "window"

# Frames per second: 60 or 120. 120 only helps on a 120 Hz (or faster) screen
# and uses about 1.5x the disk space. Change it with:  momento set fps 120
fps = 60

# Recording resolution (up to 1080p for now; 1440p and 4K are coming later):
#   "720p" | "1080p"   scaled to this size; if your screen has a different
#                      shape you get black bars, never a stretched picture
#   "native"           your screen's own size (window mode: the window's size
#                      when you picked it), scaled down to 1080p if it is bigger
# Change it from a terminal with:  momento set resolution 720p
resolution = "1080p"

# Picture quality: "standard" | "high" | "ultra"
# Change it with:  momento set quality ultra      (show current: momento settings)
quality = "high"

# Video bitrate in kbit/s. 0 = pick automatically from resolution + quality:
#                standard   high   ultra      (Mbit/s)
#     720p           6       10     15
#     1080p         10       15     25
#     native     as 720p or 1080p, by the size really recorded
#   (1440p and 4K are not offered yet; a config that still says "1440p" or
#   "2160p" records at 1080p)
#   (at 120 fps the automatic bitrate is 1.5x these)
# Set a number (e.g. 20000) to override. Disk used by a full 15-minute replay
# ~= Mbit/s * 0.11 GB (1080p high: ~1.7 GB); 60 minutes ~= Mbit/s * 0.45 GB.
bitrate_kbps = 0

# Video format. Clips are MP4 either way:
#   "auto"   the smoothest one your graphics chip records well: AV1 on AMD chips
#            that can record it (RX 7000, Ryzen 7040 and newer, ROG Ally), else H.264
#   "h264"   plays everywhere
#   "h265"   smaller files; some older devices can't play it
#   "av1"    smoothest on newer hardware; some older devices can't play it
# Only formats your graphics chip records are used: another one falls back to
# AV1 -> H.265 -> H.264, whichever works. Change it with:  momento set format av1
format = "auto"

# Encoder. "auto" follows the format above and tries hardware first:
#   vah264enc / vah265enc / vaav1enc   AMD / Intel via VA-API (GStreamer "va" plugin)
#   vah264lpenc   same, low-power encoder entry point (some Intel GPUs)
#   vaapih264enc  AMD / Intel via the older gstreamer-vaapi plugin
#   nvh264enc     NVIDIA NVENC (nvh265enc, nvav1enc for the other formats)
#   qsvh264enc    Intel Quick Sync
#   x264enc       software, H.264 only (CPU heavy; needs gst-plugins-ugly)
#   openh264enc   software, H.264 only (Cisco OpenH264)
# Naming one encoder here records in its format, whatever "format" says.
encoder = "auto"

# Draw the mouse pointer into the recording.
show_cursor = false

[audio]
# Record what you hear (game, voice chat, music...).
desktop = true
# PulseAudio/PipeWire source name. "@DEFAULT_MONITOR@" = the monitor of your
# current default output, i.e. whatever is playing through your speakers/headset.
# List others with:  pactl list short sources
desktop_device = "@DEFAULT_MONITOR@"

# Also record your microphone (mixed into the same audio track).
microphone = false
# "@DEFAULT_SOURCE@" = your default input device.
microphone_device = "@DEFAULT_SOURCE@"

# AAC audio bitrate, kbit/s.
bitrate_kbps = 160

[buffer]
# Replay length: how much history to keep, in seconds. 900 = 15 min (default),
# 1800 = 30 min, 3600 = 60 min (the maximum; any value up to it works).
# Longer needs more disk space; you can't save a clip longer than this.
# Change it with:  momento set replay_length 30m   (or Settings -> General)
max_seconds = 900

# Length of each on-disk chunk, in seconds. Clips are cut on chunk/keyframe
# boundaries, so this rarely needs changing.
segment_seconds = 10

# Where the rolling buffer lives. Put it on a fast drive with enough free space
# (see bitrate_kbps above). "~" is expanded.
# Default: $XDG_CACHE_HOME/momento/buffer, normally ~/.cache/momento/buffer
# dir = "~/.cache/momento/buffer"

# What happens to your replay when recording stops (you press Stop, or the
# window you record closes):
#   false  it's cleared (default)
#   true   it's kept, so you can still save from it. Every full replay
#          length (max_seconds, 15 min by default) of a recording session is
#          also saved to your clips folder by itself, so long sessions are
#          never lost.
# Pausing never clears anything, and neither does restarting your computer.
# Change it with:  momento set keep_history on    (or Settings -> General)
keep_history = false

# The replay holds max_seconds of footage; after that the oldest footage is
# replaced. This many minutes before that point you get a notification: with
# keep_history off, so you can save the start of your session in time; with it
# on, to say the replay is about to be saved. 3 to 10 (the bar offers 10, 5, 3).
# Change it with:  momento set hour_warning 5     (or Settings -> Misc)
warn_minutes = 10

[output]
# Where saved clips go. Empty = your Videos folder + "/Momento"
# (e.g. ~/Videos/Momento). "~" is expanded.
dir = ""

# Clip file name. Placeholders: {date} and {time} (when the clip was saved),
# {length} (the clip length, e.g. 30s or 5m).
filename = "Momento_{date}_{time}_{length}.mp4"

[hotkey]
# Register a global shortcut through the desktop's GlobalShortcuts portal
# (KDE Plasma, GNOME 48+, Hyprland...). The desktop may show a confirmation
# dialog the first time, and you can change the key later in its settings.
enabled = true

# Preferred shortcut, in XDG shortcuts syntax: modifiers CTRL, ALT, SHIFT,
# LOGO (the Super/Windows key) joined with "+", then a key name.
# Examples: "LOGO+SHIFT+g", "ALT+z", "CTRL+ALT+r", "F9"
trigger = "LOGO+SHIFT+g"

[ui]
# Keep the clip bar loaded in the background, hidden, so the shortcut shows it
# instantly (within a frame). The trade-off: the hidden bar keeps roughly
# 80-120 MB of RAM in use while Momento runs. Set to false to start a fresh bar
# on every press instead: no memory used between presses, but the bar takes
# about 0.3-0.5 s to appear.
# Change it with:  momento set instant_bar off    (or Settings -> Misc -> Instant bar)
keep_bar_loaded = true

[controller]
# Use a game controller with the clip bar (needs python-evdev, which Bazzite,
# SteamOS-likes and most gaming distros already have).
enabled = true

# Press these buttons together to open or close the bar. Buttons are named by
# position, so they work on any brand:
#   mode = PS / Xbox / Home (Guide)    dpad_up / dpad_down / dpad_left / dpad_right
#   select = View / Share / Minus      start = Menu / Options / Plus
#   thumbl / thumbr = left / right stick click
#   tl / tr = bumpers                  south / east / north / west = face buttons
#   left_paddle / right_paddle = back buttons (Elite pads, ROG Ally, Legion Go...)
# The default, PS / Xbox / Home + D-pad Down, keeps the D-pad press from your
# game: Momento holds the controller while the PS / Xbox / Home button is down
# (with exclusive = true below).
# Examples: ["select", "start"], ["left_paddle"], ["thumbl", "thumbr"]
open_chord = ["mode", "dpad_down"]

# How long to hold them, in milliseconds (0-5000). 0 (the default) opens the bar
# the instant they are all down: a tap ("Open with: Tap" in the bar's settings).
# If you use Select + Start and an emulator you play uses it too, set 300
# ("Open with: Hold") so a quick press there doesn't open the bar too.
hold_ms = 0

# While the bar is open, take the controller over so the game doesn't see the
# presses (and, for a D-pad shortcut, while its other button is held). If another
# program already holds it, Momento shares it instead.
exclusive = true
