# Release: push a tag like v0.1.0 and this builds the distro packages, the
# source tarball and SHA256SUMS, smoke-tests the packages, and creates a
# *draft* GitHub Release with them attached. Check it, then press Publish.
#
#   git tag -a v0.1.0 -m "Momento 0.1.0" && git push origin v0.1.0
#
# The tag must match momento/__init__.py's __version__.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NFPM_VERSION: 2.47.0   # checksums.txt of the nfpm release is verified on download

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches __version__
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' momento/__init__.py)"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = $code"
            exit 1
          fi
          # The app store text must describe this release too.
          if ! grep -q "<release version=\"$tag\"" packaging/flatpak/io.github.mehulchachada.Momento.metainfo.xml; then
            echo "::error::no <release version=\"$tag\"> in the metainfo"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # People-facing name: v1.0.0 -> "1.0", v1.1.0 -> "1.1", v1.0.1 -> "1.0.1".
          if [[ "$tag" =~ ^([0-9]+\.[0-9]+)\.0$ ]]; then name="${BASH_REMATCH[1]}"; else name="$tag"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check packaged systemd unit is in sync with data/momento.service
        run: |
          diff <(grep -v '^#' data/momento.service | sed 's|%h/.local/bin/momento|/usr/bin/momento|') \
               <(grep -v '^#' packaging/systemd/momento.service)

      - name: Lint and unit tests
        run: |
          python3 -m compileall -q momento
          python3 -m unittest tests.test_core
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils appstream >/dev/null
          desktop-file-validate data/io.github.mehulchachada.Momento.desktop
          appstreamcli validate --no-net packaging/flatpak/io.github.mehulchachada.Momento.metainfo.xml

      - name: Install nfpm
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          file="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/checksums.txt" | grep " ${file}\$" | sha256sum -c -
          tar xzf "$file" nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb       -t "dist/momento_${VERSION}_all.deb"
          nfpm package -f packaging/nfpm.yaml -p rpm       -t "dist/momento-${VERSION}-1.noarch.rpm"
          nfpm package -f packaging/nfpm.yaml -p archlinux -t "dist/momento-${VERSION}-1-any.pkg.tar.zst"

      - name: Source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Stable, self-hosted tarball: AUR, COPR and Flathub point at this
          # asset (its checksum never changes, unlike on-the-fly archives).
          git archive --format=tar.gz --prefix="momento-${VERSION}/" \
              -o "dist/momento-${VERSION}.tar.gz" "$GITHUB_REF_NAME"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install each package on the distro it targets (dependencies resolved from
  # that distro's own repositories) and run the CLI. No GPU or session here, so
  # only the dependency set and the launcher are tested.
  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/*.deb
          - image: ubuntu:26.04
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y -q ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -Syu --noconfirm >/dev/null && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install
        run: ${{ matrix.install }}
      - name: Run
        run: |
          momento --version
          momento settings
          python3 -c 'import gi; gi.require_version("Gst", "1.0"); from gi.repository import Gst; Gst.init(None); import dbus; from PySide6 import QtWidgets, QtMultimedia; print(Gst.version_string())'
          test -f /usr/lib/systemd/user/momento.service

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          cat > notes.md <<EOF
          **Momento ${NAME}**: instant replay for Linux games. Press play once, and when something great happens, save the last 15 seconds to 60 minutes with **Super + Shift + G**, or **Home + D-pad Down** on a controller.

          ## Install

          **Easiest, on any Linux:** paste this in a terminal. It shows what it will install and asks first.
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/install.sh | bash
          \`\`\`
          On Bazzite, Bluefin, Aurora and Ubuntu 24.04, use this one, not a package below.

          **Or download the package for your system below** and install it from your Downloads folder:

          | System | Command |
          |---|---|
          | Fedora | \`sudo dnf install ./momento-${VERSION}-1.noarch.rpm\` |
          | Ubuntu 25.04 or newer, Debian 13 or newer | \`sudo apt install ./momento_${VERSION}_all.deb\` |
          | Arch, CachyOS, EndeavourOS, Manjaro | \`sudo pacman -U momento-${VERSION}-1-any.pkg.tar.zst\` |

          After a package, run this once so Momento starts when you log in:
          \`\`\`
          systemctl --user enable --now momento.service
          \`\`\`

          Then start your game, press **Super + Shift + G**, press play and pick your game's window.

          ## Good to know

          - **Steam Gaming Mode:** works there too. Turn off Steam's own game recording, or give it a different shortcut.
          - **Ubuntu 24.04:** everything works except playing clips in the gallery, which needs Ubuntu 25.04 or newer.
          - **Fedora with AMD graphics:** for the smoothest recording, add [RPM Fusion](https://rpmfusion.org/Configuration), then run \`sudo dnf swap mesa-va-drivers mesa-va-drivers-freeworld\`.

          ## What's next

          - Support for more devices and systems, tested with your help
          - Any button combo as your controller shortcut
          - Recording in 1440p and 4K
          - Your microphone on its own audio track
          - A richer gallery: favourites, folders and playlists, trimming long clips, and quick sharing to Discord, YouTube or Steam chat

          ## Tell us how it runs

          Help make Momento great on every PC: [tell us how it runs on yours](https://github.com/${GITHUB_REPOSITORY}/issues/new?template=how-it-runs.yml). It takes 2 minutes.
          EOF
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Momento $NAME" \
              --notes-file notes.md \
              --generate-notes \
              --verify-tag \
              --draft
